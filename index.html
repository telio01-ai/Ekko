<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ekko</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap');

  :root{
    --bg: #0e1512;
    --panel: #131c17;
    --panel-2: #182220;
    --line: #24352c;
    --ink: #dfece3;
    --ink-dim: #8fa89a;
    --echo: #3ddc84;
    --echo-dim: #1f6b45;
    --echo-glow: rgba(61,220,132,0.35);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 50% 0%, rgba(61,220,132,0.07), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:'Space Mono', monospace;
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
  }

  header{
    padding:18px 22px 14px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:baseline;
    gap:12px;
    flex-shrink:0;
  }
  header .logo{
    font-family:'Fraunces', serif;
    font-size:26px;
    font-weight:600;
    color:var(--echo);
    letter-spacing:0.5px;
  }
  header .tag{
    font-size:11px;
    color:var(--ink-dim);
    text-transform:uppercase;
    letter-spacing:2px;
  }
  header .status{
    margin-left:auto;
    font-size:11px;
    color:var(--ink-dim);
    display:flex;
    align-items:center;
    gap:6px;
  }
  #reset{
    background:transparent;
    border:1px solid var(--line);
    color:var(--ink-dim);
    font-family:'Space Mono', monospace;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1px;
    padding:6px 12px;
    border-radius:4px;
    cursor:pointer;
    transition: border-color 0.15s, color 0.15s;
  }
  #reset:hover{
    border-color:var(--echo-dim);
    color:var(--echo);
  }
  header .dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--echo);
    box-shadow:0 0 8px var(--echo-glow);
  }

  #log{
    flex:1;
    overflow-y:auto;
    padding:24px;
    display:flex;
    flex-direction:column;
    gap:18px;
    scroll-behavior:smooth;
  }
  #log::-webkit-scrollbar{width:8px;}
  #log::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}

  .row{ display:flex; gap:12px; max-width:720px; }
  .row.user{ align-self:flex-end; flex-direction:row-reverse; }
  .row.assistant{ align-self:flex-start; }

  .avatar{
    flex-shrink:0;
    width:30px;height:30px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;
    font-size:14px;
    font-weight:600;
  }
  .row.assistant .avatar{
    background:var(--panel-2);
    border:1px solid var(--echo-dim);
    color:var(--echo);
  }
  .row.user .avatar{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--ink-dim);
  }

  .bubble{
    padding:12px 16px;
    border-radius:4px;
    line-height:1.55;
    font-size:14.5px;
    white-space:pre-wrap;
    word-wrap:break-word;
  }
  .row.assistant .bubble{
    background:var(--panel);
    border:1px solid var(--line);
    border-left:2px solid var(--echo);
  }
  .row.user .bubble{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--ink);
  }

  .row.assistant.thinking .bubble{
    display:flex; align-items:center; gap:6px;
    color:var(--ink-dim);
  }
  .ping{
    display:inline-block;
    width:8px;height:8px;
    border-radius:50%;
    background:var(--echo);
    animation:pulse 1.1s ease-in-out infinite;
  }
  .ping:nth-child(2){animation-delay:0.15s;}
  .ping:nth-child(3){animation-delay:0.3s;}
  @keyframes pulse{
    0%,80%,100%{ transform:scale(0.6); opacity:0.4; }
    40%{ transform:scale(1); opacity:1; }
  }

  #ripple-wrap{
    position:relative;
    height:0;
  }
  .ripple{
    position:absolute;
    left:50%; top:0;
    width:10px; height:10px;
    margin-left:-5px;
    border:1px solid var(--echo);
    border-radius:50%;
    opacity:0.6;
    animation:ripple-out 900ms ease-out forwards;
    pointer-events:none;
  }
  @keyframes ripple-out{
    to{ width:220px; height:220px; margin-left:-110px; margin-top:-105px; opacity:0; }
  }

  form#composer{
    flex-shrink:0;
    display:flex;
    gap:10px;
    padding:16px 22px 20px;
    border-top:1px solid var(--line);
    background:var(--bg);
  }
  #input{
    flex:1;
    resize:none;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--ink);
    font-family:'Space Mono', monospace;
    font-size:14.5px;
    padding:12px 14px;
    border-radius:4px;
    outline:none;
    max-height:140px;
  }
  #input:focus{
    border-color:var(--echo-dim);
    box-shadow:0 0 0 3px rgba(61,220,132,0.08);
  }
  #send{
    background:var(--echo);
    color:#062015;
    border:none;
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:13px;
    letter-spacing:1px;
    text-transform:uppercase;
    padding:0 20px;
    border-radius:4px;
    cursor:pointer;
    transition:filter 0.15s;
  }
  #send:hover{ filter:brightness(1.12); }
  #send:disabled{ opacity:0.4; cursor:default; }

  .empty-state{
    margin:auto;
    text-align:center;
    color:var(--ink-dim);
    max-width:420px;
  }
  .empty-state .logo{
    font-family:'Fraunces', serif;
    font-size:40px;
    color:var(--echo);
    margin-bottom:6px;
  }
  .empty-state p{ font-size:13px; line-height:1.6; }
</style>
</head>
<body>

<header>
  <span class="logo">Ekko</span>
  <span class="tag">assistant</span>
  <span class="status"><span class="dot"></span>à l'écoute</span>
  <button id="reset" type="button">nouvelle discussion</button>
</header>

<div id="log">
  <div class="empty-state" id="empty">
    <div class="logo">Ekko</div>
    <p>Pose-moi une question, décris-moi un problème, ou demande-moi un coup de main.<br>Je te réponds tout de suite.</p>
  </div>
</div>

<form id="composer">
  <textarea id="input" rows="1" placeholder="Écris ton message à Ekko…"></textarea>
  <button id="send" type="submit">Envoyer</button>
</form>

<script>
const log = document.getElementById('log');
const empty = document.getElementById('empty');
const form = document.getElementById('composer');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');

let history = [];

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 140) + 'px';
});
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});

function scrollDown(){
  log.scrollTop = log.scrollHeight;
}

function addBubble(role, text){
  if (empty && empty.parentNode) empty.remove();
  const row = document.createElement('div');
  row.className = 'row ' + role;
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = role === 'assistant' ? 'E' : 'moi'.slice(0,1).toUpperCase();
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  row.appendChild(avatar);
  row.appendChild(bubble);
  log.appendChild(row);
  scrollDown();
  return { row, bubble };
}

function addThinking(){
  if (empty && empty.parentNode) empty.remove();
  const row = document.createElement('div');
  row.className = 'row assistant thinking';
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = 'E';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = '<span class="ping"></span><span class="ping"></span><span class="ping"></span>';
  row.appendChild(avatar);
  row.appendChild(bubble);
  log.appendChild(row);
  scrollDown();
  return row;
}

function fireRipple(){
  const wrap = document.createElement('div');
  wrap.id = 'ripple-wrap';
  const r = document.createElement('div');
  r.className = 'ripple';
  wrap.appendChild(r);
  form.style.position = 'relative';
  form.appendChild(wrap);
  setTimeout(() => wrap.remove(), 950);
}

async function askEkko(userText){
  history.push({ role: 'user', content: userText });

  const thinkingRow = addThinking();
  sendBtn.disabled = true;

  try{
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history })
    });

    const data = await response.json();
    if (!response.ok) throw new Error(data.error || 'Erreur serveur');
    const answer = data.answer || "Je n'ai pas réussi à formuler de réponse, réessaie ?";

    thinkingRow.remove();
    addBubble('assistant', answer);
    history.push({ role: 'assistant', content: answer });
  }catch(err){
    thinkingRow.remove();
    addBubble('assistant', "Petit souci de connexion. Réessaie dans un instant.");
    console.error(err);
  }finally{
    sendBtn.disabled = false;
  }
}

document.getElementById('reset').addEventListener('click', () => {
  history = [];
  log.innerHTML = '';
  const fresh = document.createElement('div');
  fresh.className = 'empty-state';
  fresh.id = 'empty';
  fresh.innerHTML = '<div class="logo">Ekko</div><p>Nouvelle discussion. De quoi veux-tu parler ?</p>';
  log.appendChild(fresh);
  input.focus();
});

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  addBubble('user', text);
  fireRipple();
  input.value = '';
  input.style.height = 'auto';
  askEkko(text);
});
</script>
</body>
</html>
